# The check named `Dependency floor`. Issue #16. A second restore of the same
# tree, at the oldest dependency versions this project says it supports, with
# the suite run against it.
#
# The failure it prevents surfaces at the operator rather than in the suite. The
# lock resolves to the newest graph the bounds allow, every other check on a
# pull request runs on that graph, and a stage written against an interface that
# arrived after the declared minimum passes all of them. The operator who
# installed at the minimum meets an import error instead of a result.
#
# The floor is derived and never repeated here. `uv lock --resolution
# lowest-direct` takes the lowest version each bound in pyproject.toml admits
# for a direct dependency, so raising or lowering a bound moves this job in the
# same commit and the two cannot drift apart. No version number appears in this
# file, which is the point of it.
#
# The restore is the whole declared graph, with no group left out. It was not
# always: the `quality` group used to be dropped here because the oldest PyYAML
# its bound admitted published no wheel for the pinned interpreter series and
# its source build failed on it, which made the declared minimum of four
# packages a minimum nobody could restore. The bound now names a version that
# installs, so the group comes back in, and with it the slow half of the suite,
# which reads the invariants rules and cannot run without the parser they
# import.
#
# Hardened like the other workflows here: actions SHA-pinned with a version
# comment, checkout with persist-credentials:false, deny-all permissions at the
# workflow level with the read scope granted on the job.
name: Dependency floor

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: Dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the tree, the bounds and the suite
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Resolve the floor from the declared minimums
        # This rewrites uv.lock inside the runner and nothing carries it back.
        # The step prints every version it moved, so the log says which floor
        # was tested rather than leaving a reader to work it out from bounds.
        run: uv lock --resolution lowest-direct

      - name: Restore at the floor
        run: uv sync --frozen

      - name: The graph this run actually got
        # Printed rather than asserted. An assertion here would be a list of
        # versions in a workflow file, which is the drift this job is built to
        # avoid in the first place.
        run: uv pip list

      - name: The whole suite passes at the floor
        # Both halves, which is what `-m ""` means here and what the default
        # `pytest -q` leaves out. The slow half starts a second interpreter and
        # runs the invariants rules over every file in the tree, and those rules
        # import the parser whose bound this job used to have to skip. Running
        # the fast half alone would restore that package and never execute a
        # line of it.
        run: uv run --frozen pytest -q -m ""

      - name: Prove this check refuses an interface the floor does not have
        # A file whose only defect is that it reaches past the floor. Without
        # this step the job is green whether the floor restore ran the code or
        # merely installed it, which is the failure this check exists against.
        run: |
          set -euo pipefail
          fixture=fixtures/only_a_floor_defect.py
          if uv run --frozen python "$fixture" > proof.log 2>&1; then
            echo "the floor accepted an interface it does not carry" >&2
            cat proof.log >&2
            exit 1
          fi
          grep -q 'factor_system' proof.log
          echo "refused, as it should:"
          cat proof.log

      - name: Prove the refusal was the floor and not the file
        # The same file, on the graph the lock resolves to, has to run. That is
        # what makes the step above evidence about a version bound rather than
        # about a broken fixture. The linter, the formatter and the type checker
        # accept it too, so a red step above means the floor and nothing else.
        run: |
          set -euo pipefail
          fixture=fixtures/only_a_floor_defect.py
          git checkout -- uv.lock
          uv sync --locked
          uv run --frozen python "$fixture"
          uv run --frozen ruff check --no-cache "$fixture"
          uv run --frozen ruff format --check "$fixture"
          uv run --frozen mypy "$fixture"

      - name: What this run did not cover
        # Last, so the end of the log is the disclosure and not a step after it.
        run: |
          echo "the linter, the formatter and the type checker are restored at"
          echo "their floors and nothing runs them at one, so a setting in"
          echo "pyproject.toml newer than the oldest version of the tool that"
          echo "reads it is not caught here."
          echo "the floor tested is the lowest version each direct bound admits."
          echo "a transitive dependency is resolved to its newest allowed"
          echo "version here, so nothing in this run is a claim about one."
