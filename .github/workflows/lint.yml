# The check named `lint`. Three rules under one name: the linter over the Python
# this tree writes, which is what #17 asks for, the decision record rule of #1
# over docs/decisions/, and the rule of #86 that holds the table of checks in
# CONTRIBUTING.md against the workflow files.
#
# The third one is here rather than under a name of its own for a reason it is
# worth stating: a check named in the table would be a check that has to name
# itself, and the row it owed would be the first thing it refused.
#
# The job name is exactly `lint`, in lowercase, because #23 requires that
# literal string on the branch that receives merges and a check context that
# does not match the required name blocks every merge instead of guarding one.
#
# What the linter enforces is configured in pyproject.toml and not here, so the
# command a contributor runs and the command this job runs are the same command
# and cannot disagree about a rule.
#
# Each rule runs twice, once over the tree and once over something built to be
# refused, and the job fails if the refusal does not happen. Without that half
# the check is green whether either rule refuses anything or not, which is the
# failure both issues are about. The decision record rule's own suite runs
# first, because a guard whose proof is not run on the same commit that runs the
# guard is a guard nobody is checking.
#
# Hardened like the other workflows here: actions SHA-pinned with a version
# comment, checkout with persist-credentials:false, deny-all permissions at the
# workflow level with the read scope granted on the job.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the records and the rule that reads them
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Restore the locked environment
        # The same command the README documents, so this job runs the rule on
        # the interpreter a contributor runs it on rather than on whatever the
        # runner image happens to carry.
        run: uv sync --locked

      - name: The Python in this tree passes the linter
        run: uv run --frozen ruff check

      - name: Prove this check refuses a file with only a lint defect
        # An import nothing uses. The formatter has no opinion about that file
        # and the type checker has none either, and both are run here to prove
        # it, so a red `lint` on this fixture means the linter and nothing else.
        run: |
          set -euo pipefail
          fixture=fixtures/only_a_lint_defect.py
          if uv run --frozen ruff check --no-cache "$fixture" > proof.log 2>&1
          then
            echo "the linter accepted a file with an unused import" >&2
            cat proof.log >&2
            exit 1
          fi
          cat proof.log
          uv run --frozen ruff format --check "$fixture"
          uv run --frozen mypy "$fixture"

      - name: Prove the decision record rule bites
        run: uv run --frozen python tools/test_decision_records.py

      - name: The decision records are in shape
        run: uv run --frozen python tools/decision_records.py docs/decisions

      - name: Prove this check refuses a record with a section missing
        # One heading is deleted from one record and nothing else is touched, so
        # the copy's only defect is the missing field. If the rule accepts it,
        # the check is decorative and this step says so.
        run: |
          set -euo pipefail
          rm -rf ../missing-section-proof
          cp -R docs/decisions ../missing-section-proof
          victim=../missing-section-proof/0001-the-shape-of-a-decision-record.md
          grep -q '^## Ruled out$' "$victim"
          sed '/^## Ruled out$/d' "$victim" > "$victim.edited"
          mv "$victim.edited" "$victim"
          if uv run --frozen python tools/decision_records.py \
               ../missing-section-proof > proof.log 2>&1; then
            echo "the rule accepted a record with a required section removed" >&2
            cat proof.log >&2
            exit 1
          fi
          grep -q 'section-missing' proof.log
          echo "refused, as it should:"
          cat proof.log

      - name: Prove the checks-table rule bites
        run: uv run --frozen python tools/test_checks_table.py

      - name: The table of checks matches the workflows
        run: uv run --frozen python tools/checks_table.py .

      - name: Prove this check refuses a table missing a row
        # A copy of the tree with one row deleted from the table and nothing
        # else touched, so the copy's only defect is the missing row. This is
        # the direction with the cost: a check runs on a pull request and the
        # document a contributor looks it up in does not mention it. The
        # identifier is asserted, not merely a non-zero exit, because two arms
        # read the same two inputs and a row that went away is also a check
        # nothing names.
        run: |
          set -euo pipefail
          rm -rf ../missing-row-proof
          mkdir -p ../missing-row-proof
          cp -R .github ../missing-row-proof/
          grep -q '^| `Dependency floor` |' CONTRIBUTING.md
          grep -v '^| `Dependency floor` |' CONTRIBUTING.md \
            > ../missing-row-proof/CONTRIBUTING.md
          if uv run --frozen python tools/checks_table.py \
               ../missing-row-proof > proof.log 2>&1; then
            echo "the rule accepted a table with a row removed" >&2
            cat proof.log >&2
            exit 1
          fi
          grep -q 'unnamed-check' proof.log
          echo "refused, as it should:"
          cat proof.log

      - name: Prove the third party notice rule bites
        run: uv run --frozen python tools/test_third_party_notices.py

      - name: The notice says what the lock and this environment say
        run: |
          uv run --frozen python tools/third_party_notices.py \
            --check THIRD-PARTY-NOTICES.md

      - name: Prove this check refuses a notice that drifted from the lock
        # A copy of the notice with one version bumped by one character and
        # nothing else touched, which is the drift that happens when a
        # dependency moves and nobody regenerates the file. Which row to bump is
        # read out of the notice rather than named here, so this step does not
        # go stale the day that dependency moves. The identifier is asserted
        # rather than a non-zero exit, because several arms read the same two
        # inputs and a row that went away is also a row whose version changed.
        run: |
          set -euo pipefail
          awk -F'|' 'BEGIN { OFS = "|"; done = 0 }
                     /^\| `/ && !done {
                       $3 = substr($3, 1, length($3) - 1) "x "
                       done = 1
                     }
                     { print }' \
            THIRD-PARTY-NOTICES.md > ../drifted-notice.md
          diff THIRD-PARTY-NOTICES.md ../drifted-notice.md && exit 1
          if uv run --frozen python tools/third_party_notices.py \
               --check ../drifted-notice.md > proof.log 2>&1; then
            echo "the rule accepted a notice whose version had moved" >&2
            cat proof.log >&2
            exit 1
          fi
          grep -q 'version:' proof.log
          echo "refused, as it should:"
          cat proof.log
