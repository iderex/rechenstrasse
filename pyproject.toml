[project]
name = "rechenstrasse"
version = "0.0.0"
description = "From an action to post-Newtonian parameters and cosmological perturbation equations, in the open."
readme = "README.md"
# The interpreter series this tree is written against. The exact build is fixed
# in .python-version; this range is what the resolver was given, and it is
# closed at the top because a resolution valid for one series is not a claim
# about the next one.
requires-python = ">=3.13,<3.14"
dependencies = [
    # Record 0002 names SymPy as the computer algebra system in the same
    # process. The floor is a version, not a preference: the lock below is what
    # fixes the graph, and this bound only says which resolutions were allowed.
    "sympy>=1.13,<2",
]

[dependency-groups]
# The three checks of #17. Each is configured below rather than in a workflow,
# so the command a contributor runs and the command the gate runs are the same
# command and cannot disagree.
quality = [
    "ruff>=0.14,<0.15",
    "mypy>=1.18,<2",
    # Read by the invariants rules that judge the workflow files. Two of those
    # rules are about the structure of a document rather than about its text,
    # and an indentation-counting approximation of a parser is the thing that
    # passes a file it should have refused.
    #
    # 6.0.2 is the oldest release publishing a wheel for the interpreter series
    # in requires-python. The bound here used to admit 6.0, which has no wheel
    # for that series and whose source build fails on this interpreter, so the
    # declared minimum was one nobody could restore and the whole group went
    # untested at its floor. That is what issue #84 was opened about. This is an
    # extension module, so which release installs is a property of the release
    # rather than of the code that imports it, and the floor moves again the day
    # the interpreter series does.
    "pyyaml>=6.0.2,<7",
    # The stubs the type checker reads for the package above, left at the series
    # floor rather than moved with it. This is a pure-Python distribution with
    # one wheel for every interpreter, so the pinned build narrows nothing here:
    # 6.0.0 restores on it and the type checker accepts the tree against those
    # stubs. #84 asked whether the same repair was owed on this line, and the
    # answer is measured rather than assumed.
    "types-pyyaml>=6,<7",
]
# The harness of #14. A floor rather than a pin, the same as everything else
# here, because uv.lock is what fixes the graph. The floor is 9.0.3 and it is
# not a taste: GHSA-6w46-j5rx-g56g reports vulnerable temporary directory
# handling in everything below it, and the dependency review on a pull request
# refuses a newly introduced package carrying an advisory of any severity. The
# features this suite needs, `pytest.MonkeyPatch` as a context manager and the
# strict expected-failure behaviour the guard's proof rests on, are older than
# that floor and are not what sets it.
#
# The measurement tool of #15, in the same group, because the `tests` check runs
# the suite under it and a contributor who has to remember a second install to
# reproduce the number is a contributor who reads it off the gate instead. Its
# floor is the series this configuration was written against and nothing more
# than that: no claim is made here about advisories below it, and what judges
# that question for a package arriving in this diff is the dependency review on
# the pull request, which fails on a known vulnerability of any severity. The
# number it prints does not gate. The bar is #49 and the three ways it has to
# fail closed are written there.
tests = [
    "coverage>=7.6,<8",
    "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rechenstrasse"]

[tool.uv]
# The lock is what makes two clones agree, so what is asked of uv itself is a
# floor rather than an exact pin: below this the lock format and `sync --locked`
# are not the ones this tree was written against.
required-version = ">=0.12"
# Installed by the default `uv sync`, because a contributor who has to remember
# a flag to get the checks is a contributor who meets them on the gate. The
# suite is in the same list for the same reason.
default-groups = ["quality", "tests"]

[tool.pytest.ini_options]
minversion = "9.0.3"
testpaths = ["tests"]
# The fast suite is what `pytest -q` means, and it is the default because a
# default nobody runs is not a default. `pytest -m slow` runs the other half,
# and `pytest -m ""` runs both. The later -m wins, so neither of those has to
# undo this line.
addopts = ["-m", "not slow"]
# Registered rather than free-form, so a marker with a typo in it is an error
# instead of a test that silently stops being selected by either half.
markers = [
    "slow: starts a second process or walks the whole tree, and is left out of the default run",
]
# A warning this suite raises is a defect in this suite. The pipeline passes
# expressions between stages, and a deprecation from the algebra library is the
# earliest warning that a stage is using an interface that is going away.
filterwarnings = ["error"]

[tool.ruff]
# The Python this tree runs on, so a rule about a newer syntax does not fire on
# code the pinned interpreter cannot run.
target-version = "py313"
line-length = 88
src = ["src", "tools", "tests", "native_or_long"]
# Two holes, both deliberate and both named.
#
# .github/pr-hygiene/ is a self-contained standard-library module with its own
# suite, landed under its own issue, and this change does not bring it under
# these commands. That is a hole rather than a decision and it is written into
# #17 as one.
#
# The two fixtures are files whose whole purpose is to be refused. They are
# excluded by name and never by directory, so a fourth file appearing in
# fixtures/ is read by these commands like any other. The third fixture is not
# listed, because the thing it is refused by is the type checker and these
# commands accept it, which is what makes it a fixture for one check and not
# for three.
extend-exclude = [
    ".github",
    "fixtures/only_a_lint_defect.py",
    "fixtures/only_a_format_defect.py",
]

[tool.ruff.lint]
# E and F are the floor. I is import order, which is the argument in review this
# check exists to end. B catches the bug-shaped mistakes, UP keeps the syntax at
# the pinned interpreter, and RUF is ruff's own set. Deliberately not the whole
# catalogue: a rule nobody agreed to is a rule that gets suppressed inline.
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
# The type checker in strict mode, which is what #17 asks for. The pipeline
# passes tensor expressions between stages, and the value of a checker there is
# that it says which stage got the wrong shape rather than which line crashed.
python_version = "3.13"
strict = true
# The directories this repository writes. tests/ is here from the day the suite
# of #14 exists, because a test that passes the wrong shape into a stage is the
# same defect as a stage that accepts it, and strict mode is what says which
# stage got the wrong shape. .github/pr-hygiene/ is a self-contained
# standard-library module with its own suite and its own issue, and is not
# brought under this command by this change. fixtures/ is outside this list
# because one of the files in it exists to be refused here, and the job that
# runs this checker is what runs it against that file. native_or_long/ is here
# from the day the harness of #65 exists: it is the suite that runs where the
# default one cannot, and a wrong shape passed into the seam there is the same
# defect as one passed in the default run.
files = ["src", "tools", "tests", "native_or_long"]
# The pipeline imports SymPy, which ships no type information this checker can
# read. Ignoring the missing stubs is narrower than ignoring the import.
[[tool.mypy.overrides]]
module = ["sympy.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Configured here rather than in the job, so the number a contributor measures
# in a clone and the number the `tests` check prints come from the same
# settings. Issue #15 asks for the number and asks that it not gate; the bar and
# the surface it is pinned on are #49.
#
# The package and not the whole tree. This is the code the default suite
# exercises, and it is the only part of the tree whose number the default run
# can honestly report: tools/ is read by proofs that run in their own checks and
# would show here as uncovered work that is in fact covered elsewhere. The
# whole-tree number is #49's and is not this one.
source = ["src/rechenstrasse"]
# Branch coverage, because a stage that refuses on one arm and returns on the
# other is exactly the shape this pipeline is made of, and a line number cannot
# tell those two apart.
branch = true
# Paths in the report relative to the root, so the same run is readable in a
# clone and on a runner and the two can be compared line for line.
relative_files = true

[tool.coverage.report]
# Which lines are missing, not merely how many. A percentage alone tells nobody
# what to write next.
show_missing = true
